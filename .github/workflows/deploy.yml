name: Deploy to VM

on:
  push:
    branches:
      - main
      - master
      - claude/add-explanation-PhILD

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull origin ${{ github.ref_name }}
            pip install -r requirements.txt --quiet

            # 봇 서비스 재시작 (systemd 사용 시)
            if systemctl is-active --quiet ${{ secrets.VM_SERVICE_NAME }}; then
              sudo systemctl restart ${{ secrets.VM_SERVICE_NAME }}
              echo "서비스 재시작 완료: ${{ secrets.VM_SERVICE_NAME }}"
            else
              echo "서비스가 실행 중이 아닙니다. VM에서 수동 시작이 필요할 수 있습니다."
            fi
