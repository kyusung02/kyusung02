name: Deploy to GCP

on:
  push:
    branches:
      - master
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      SERVICE_NAME: ${{ secrets.VM_SERVICE_NAME }}

    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          envs: DEPLOY_BRANCH,SERVICE_NAME
          script: |
            set -e
            cd ~/kyusung02

            echo "=== git fetch & checkout ==="
            git fetch origin
            git checkout $DEPLOY_BRANCH || git checkout -b $DEPLOY_BRANCH origin/$DEPLOY_BRANCH
            git pull origin $DEPLOY_BRANCH

            echo "=== 봇 재시작 ==="
            sudo systemctl restart $SERVICE_NAME
            echo "$SERVICE_NAME 서비스 재시작 완료"

            echo "=== 서비스 상태 확인 ==="
            sleep 3
            systemctl status $SERVICE_NAME --no-pager -l | tail -20
