name: Deploy to GCP

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH 접속 후 배포
        # mutable tag 대신 commit SHA로 핀(supply chain attack 방어). v1.0.3 = 029f5b4...
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/kyusung02

            echo "=== TZ 설정 확인 ==="
            if ! grep -q 'Environment=TZ=Asia/Seoul' /etc/systemd/system/nemo-bot.service 2>/dev/null; then
              sudo sed -i '/^\[Service\]/a Environment=TZ=Asia\/Seoul' /etc/systemd/system/nemo-bot.service
              sudo systemctl daemon-reload
              echo "TZ=Asia/Seoul 추가 완료"
            fi

            echo "=== git pull ==="
            git pull origin master

            echo "=== 문법 검사 ==="
            # 문법 오류 커밋이 봇을 죽이기 전에 차단 (set -e로 실패 시 재시작 안 함)
            python3 -m py_compile main.py clients.py config.py storage.py utils.py handlers/*.py services/*.py
            echo "py_compile 통과"

            echo "=== 의존성 동기화 ==="
            pip3 install -r requirements.txt --user --quiet

            echo "=== 봇 재시작 ==="
            SVC=""
            for s in nemo-bot kyusung02 bot; do
              if systemctl is-active --quiet "$s"; then SVC="$s"; break; fi
            done
            if [ -z "$SVC" ]; then
              echo "ERROR: nemo-bot / kyusung02 / bot 서비스를 찾을 수 없습니다"
              exit 1
            fi
            sudo systemctl restart "$SVC"
            echo "$SVC 서비스 재시작 완료"

            echo "=== 서비스 상태 확인 ==="
            sleep 3
            if ! systemctl is-active --quiet "$SVC"; then
              echo "ERROR: $SVC 재시작 후 비활성 상태 — 배포 실패"
              sudo journalctl -u "$SVC" -n 30 --no-pager || true
              exit 1
            fi
            systemctl status "$SVC" --no-pager -l | tail -20
