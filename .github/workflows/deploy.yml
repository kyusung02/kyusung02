name: Deploy to GCP

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH 접속 후 배포
        # mutable tag 대신 commit SHA로 핀(supply chain attack 방어). v1.0.3 = 029f5b4...
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/kyusung02

            echo "=== TZ 설정 확인 ==="
            if ! grep -q 'Environment=TZ=Asia/Seoul' /etc/systemd/system/nemo-bot.service 2>/dev/null; then
              sudo sed -i '/^\[Service\]/a Environment=TZ=Asia\/Seoul' /etc/systemd/system/nemo-bot.service
              sudo systemctl daemon-reload
              echo "TZ=Asia/Seoul 추가 완료"
            fi

            echo "=== git pull ==="
            git pull origin master

            echo "=== 의존성 동기화 ==="
            pip3 install -r requirements.txt --user --quiet

            echo "=== 봇 재시작 ==="
            if systemctl is-active --quiet nemo-bot; then
              sudo systemctl restart nemo-bot
              echo "nemo-bot 서비스 재시작 완료"
            elif systemctl is-active --quiet kyusung02; then
              sudo systemctl restart kyusung02
              echo "kyusung02 서비스 재시작 완료"
            elif systemctl is-active --quiet bot; then
              sudo systemctl restart bot
              echo "bot 서비스 재시작 완료"
            else
              echo "ERROR: nemo-bot / kyusung02 / bot 서비스를 찾을 수 없습니다"
              exit 1
            fi

            echo "=== 서비스 상태 확인 ==="
            sleep 3
            if systemctl is-active --quiet nemo-bot; then
              systemctl status nemo-bot --no-pager -l | tail -20
            elif systemctl is-active --quiet kyusung02; then
              systemctl status kyusung02 --no-pager -l | tail -20
            else
              systemctl status bot --no-pager -l | tail -20
            fi
