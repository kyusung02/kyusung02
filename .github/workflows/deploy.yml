name: Deploy to GCP

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/kyusung02

            echo "=== git pull ==="
            git pull origin master

            echo "=== 봇 재시작 ==="
            if systemctl is-active --quiet kyusung02; then
              sudo systemctl restart kyusung02
              echo "kyusung02 서비스 재시작 완료"
            elif systemctl is-active --quiet bot; then
              sudo systemctl restart bot
              echo "bot 서비스 재시작 완료"
            else
              echo "ERROR: kyusung02 또는 bot 서비스를 찾을 수 없습니다"
              exit 1
            fi

            echo "=== 서비스 상태 확인 ==="
            sleep 3
            if systemctl is-active --quiet kyusung02; then
              systemctl status kyusung02 --no-pager -l | tail -20
            else
              systemctl status bot --no-pager -l | tail -20
            fi
